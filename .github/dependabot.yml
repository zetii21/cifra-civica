version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]

  - package-ecosystem: pip
    directory: /services/simulation-api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, python]

  - package-ecosystem: pip
    directory: /model-lab
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencies, model-validation]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: monthly
    labels: [dependencies, containers]
